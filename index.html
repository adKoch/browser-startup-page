<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Page</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      height: 100vh;
      padding: clamp(16px, 3vh, 60px) clamp(20px, 5vw, 80px);
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 2vh, 32px);
      justify-content: space-between;
      overflow: hidden;
    }

    /* Clock */
    .clock-section {
      text-align: center;
    }

    .clock-time {
      font-size: clamp(36px, 8vh, 80px);
      font-weight: 200;
      letter-spacing: -2px;
      line-height: 1;
    }

    .clock-date {
      font-size: clamp(12px, 1.8vh, 16px);
      opacity: 0.55;
      margin-top: clamp(4px, 1vh, 10px);
    }

    /* Current Weather */
    .weather-section {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: clamp(12px, 2.5vh, 32px) clamp(16px, 3vw, 40px);
      backdrop-filter: blur(6px);
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: clamp(10px, 2vw, 20px);
      margin-bottom: clamp(10px, 2vh, 24px);
    }

    .weather-icon-large {
      font-size: clamp(28px, 5vh, 56px);
      line-height: 1;
    }

    .weather-temp-large {
      font-size: clamp(24px, 5vh, 52px);
      font-weight: 200;
      line-height: 1;
    }

    .weather-desc-main {
      font-size: clamp(13px, 2vh, 18px);
      opacity: 0.6;
      margin-left: 4px;
    }

    .weather-details {
      display: flex;
      gap: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: clamp(8px, 1.5vh, 20px);
    }

    .weather-detail {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      padding-right: clamp(12px, 2vw, 24px);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      margin-right: clamp(12px, 2vw, 24px);
    }

    .weather-detail:last-child {
      border-right: none;
      margin-right: 0;
      padding-right: 0;
    }

    .detail-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.45;
    }

    .detail-value {
      font-size: clamp(14px, 2.5vh, 20px);
      font-weight: 300;
    }

    /* Forecast */
    .forecast-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 1.5vh, 16px);
    }

    .forecast-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: clamp(10px, 2vh, 24px);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 1vh, 10px);
    }

    .forecast-day {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.45;
    }

    .forecast-icon {
      font-size: clamp(20px, 3.5vh, 36px);
      line-height: 1;
    }

    .forecast-temps {
      font-size: clamp(14px, 2.2vh, 20px);
      font-weight: 300;
    }

    .forecast-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .forecast-detail {
      font-size: clamp(11px, 1.5vh, 13px);
      opacity: 0.6;
    }

    /* Media */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px, 1.5vw, 20px);
    }

    .media-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 1vh, 12px);
      padding: clamp(10px, 2vh, 24px) clamp(8px, 1.5vw, 16px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      text-decoration: none;
      color: #fff;
      transition: background 0.2s, transform 0.2s;
      backdrop-filter: blur(6px);
    }

    .media-card:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-4px);
    }

    .media-card img {
      width: clamp(32px, 5vw, 64px);
      height: clamp(32px, 5vw, 64px);
      border-radius: 12px;
    }

    .media-card span {
      font-size: clamp(11px, 1.4vh, 13px);
      font-weight: 500;
      text-align: center;
      opacity: 0.9;
    }

    /* Bookmarks */
    .bookmarks-section {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(340px, 25vw), 1fr));
      gap: clamp(6px, 1vh, 13px);
    }

    .bookmark-group {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: clamp(14px, 2.5vh, 32px);
      backdrop-filter: blur(6px);
    }

    .bookmark-group h3 {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.45;
      margin-bottom: clamp(8px, 1.5vh, 19px);
    }

    .bookmark-link {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1vw, 13px);
      padding: clamp(6px, 0.9vh, 11px) 0;
      text-decoration: none;
      color: #fff;
      opacity: 0.85;
      transition: opacity 0.15s;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .bookmark-link:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .bookmark-link:first-of-type {
      padding-top: 0;
    }

    .bookmark-link:hover {
      opacity: 1;
    }

    .bookmark-link img {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .bookmark-link span {
      font-size: clamp(12px, 1.6vh, 14px);
    }

    .error {
      padding: 2rem;
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const CONFIGS = ['default', 'media', 'office'];

    const MEDIA_SERVICES = [
      { name: 'YouTube',     url: 'https://www.youtube.com' },
      { name: 'Twitch',      url: 'https://www.twitch.tv' },
      { name: 'Spotify',     url: 'https://open.spotify.com' },
      { name: 'Disney+',     url: 'https://www.disneyplus.com' },
      { name: 'HBO Max',     url: 'https://www.max.com' },
      { name: 'Netflix',     url: 'https://www.netflix.com' },
      { name: 'Prime Video', url: 'https://www.primevideo.com' },
      { name: 'Apple TV',    url: 'https://tv.apple.com' },
    ];

    function weatherEmoji(code) {
      if (code === 0)  return ['☀️',  'Clear'];
      if (code <= 3)   return ['⛅',  'Partly cloudy'];
      if (code <= 48)  return ['🌫️', 'Foggy'];
      if (code <= 67)  return ['🌧️', 'Rain'];
      if (code <= 77)  return ['🌨️', 'Snow'];
      if (code <= 82)  return ['🌧️', 'Showers'];
      if (code <= 86)  return ['🌨️', 'Snow showers'];
      return                  ['⛈️',  'Thunderstorm'];
    }

    function faviconUrl(url) {
      const domain = new URL(url).hostname;
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
    }

    function renderClock(timezone) {
      const section = document.createElement('div');
      section.className = 'clock-section';

      const time = document.createElement('div');
      time.className = 'clock-time';

      const date = document.createElement('div');
      date.className = 'clock-date';

      section.append(time, date);

      const opts = timezone ? { timeZone: timezone } : {};
      const update = () => {
        const now = new Date();
        time.textContent = now.toLocaleTimeString([], { ...opts, hour: '2-digit', minute: '2-digit' });
        date.textContent = now.toLocaleDateString([], { ...opts, weekday: 'long', day: 'numeric', month: 'long' });
      };
      update();
      setInterval(update, 1000);

      return section;
    }

    function renderWeatherSection(current) {
      const { temperature_2m, apparent_temperature, relative_humidity_2m, precipitation, weather_code, is_day } = current;
      const [emoji, desc] = weatherEmoji(weather_code);

      const section = document.createElement('div');
      section.className = 'weather-section';
      section.innerHTML = `
        <div class="weather-main">
          <div class="weather-icon-large">${emoji}</div>
          <div class="weather-temp-large">${Math.round(temperature_2m)}°C</div>
          <div class="weather-desc-main">${desc}</div>
        </div>
        <div class="weather-details">
          <div class="weather-detail">
            <span class="detail-label">Feels like</span>
            <span class="detail-value">${Math.round(apparent_temperature)}°C</span>
          </div>
          <div class="weather-detail">
            <span class="detail-label">Humidity</span>
            <span class="detail-value">${relative_humidity_2m}%</span>
          </div>
          <div class="weather-detail">
            <span class="detail-label">Rain</span>
            <span class="detail-value">${precipitation} mm</span>
          </div>
          <div class="weather-detail">
            <span class="detail-label">Time of day</span>
            <span class="detail-value">${is_day ? '☀️ Day' : '🌙 Night'}</span>
          </div>
        </div>
      `;
      return section;
    }

    function renderForecastSection(daily, timezone) {
      const section = document.createElement('div');
      section.className = 'forecast-section';

      for (let i = 1; i <= 3; i++) {
        const date = new Date(daily.time[i] + 'T12:00:00');
        const tzOpts = timezone ? { timeZone: timezone } : {};
        const dayName = i === 1
          ? 'Tomorrow'
          : date.toLocaleDateString([], { ...tzOpts, weekday: 'long' });
        const [emoji] = weatherEmoji(daily.weather_code[i]);

        const card = document.createElement('div');
        card.className = 'forecast-card';
        card.innerHTML = `
          <div class="forecast-day">${dayName}</div>
          <div class="forecast-icon">${emoji}</div>
          <div class="forecast-temps">${Math.round(daily.temperature_2m_max[i])}° / ${Math.round(daily.temperature_2m_min[i])}°</div>
          <div class="forecast-details">
            <div class="forecast-detail">💧 Rain ${daily.precipitation_probability_max[i]}%</div>
            <div class="forecast-detail">🌡️ Feels ${Math.round(daily.apparent_temperature_max[i])}° / ${Math.round(daily.apparent_temperature_min[i])}°</div>
          </div>
        `;
        section.appendChild(card);
      }

      return section;
    }

    function renderMedia() {
      const grid = document.createElement('div');
      grid.className = 'media-grid';

      MEDIA_SERVICES.forEach(({ name, url }) => {
        const a = document.createElement('a');
        a.className = 'media-card';
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const img = document.createElement('img');
        img.src = faviconUrl(url);
        img.alt = name;

        const span = document.createElement('span');
        span.textContent = name;

        a.append(img, span);
        grid.appendChild(a);
      });

      return grid;
    }

    function renderBookmarks(bookmarks) {
      const section = document.createElement('div');
      section.className = 'bookmarks-section';

      bookmarks.forEach(group => {
        const card = document.createElement('div');
        card.className = 'bookmark-group';

        if (group.name) {
          const h3 = document.createElement('h3');
          h3.textContent = group.name;
          card.appendChild(h3);
        }

        (group.links || []).forEach(({ title, url }) => {
          const a = document.createElement('a');
          a.className = 'bookmark-link';
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

          const img = document.createElement('img');
          img.src = faviconUrl(url);
          img.alt = '';

          const span = document.createElement('span');
          span.textContent = title;

          a.append(img, span);
          card.appendChild(a);
        });

        section.appendChild(card);
      });

      return section;
    }

    async function main() {
      const params = new URLSearchParams(location.search);
      const param = params.get('config') || 'default';
      const configName = CONFIGS.includes(param) ? param : 'default';
      const app = document.getElementById('app');

      let config;
      try {
        const res = await fetch(`configs/${configName}.yaml?v=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        config = jsyaml.load(await res.text());
      } catch (e) {
        app.innerHTML = `<div class="error">Failed to load config "${configName}.yaml": ${e.message}</div>`;
        return;
      }

      if (config.background_image) {
        document.body.style.backgroundImage = `url(${config.background_image})`;
      }

      const sections = config.sections || ['media', 'bookmarks'];

      let weatherData = null;
      const needsWeather = sections.includes('weather') || sections.includes('forecast');
      if (needsWeather) {
        try {
          const { latitude: lat, longitude: lon } = await new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
              reject(new Error('Geolocation not supported'));
              return;
            }
            navigator.geolocation.getCurrentPosition(
              (pos) => resolve(pos.coords),
              (err) => reject(err),
              { timeout: 10000 }
            );
          });
          const res = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
            `&current=temperature_2m,weather_code,apparent_temperature,relative_humidity_2m,precipitation,is_day` +
            `&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,weather_code,precipitation_probability_max` +
            `&temperature_unit=celsius&timezone=auto&forecast_days=4`
          );
          weatherData = await res.json();
        } catch {
          // weather unavailable (permission denied or API error), sections will be skipped
        }
      }

      for (const section of sections) {
        switch (section) {
          case 'clock':
            app.appendChild(renderClock(config.timezone));
            break;
          case 'weather':
            if (weatherData) app.appendChild(renderWeatherSection(weatherData.current));
            break;
          case 'forecast':
            if (weatherData) app.appendChild(renderForecastSection(weatherData.daily, config.timezone));
            break;
          case 'media':
            app.appendChild(renderMedia());
            break;
          case 'bookmarks':
            if (config.bookmarks?.length) app.appendChild(renderBookmarks(config.bookmarks));
            break;
        }
      }
    }

    main();
  </script>
</body>
</html>
