<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Page</title>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    /* Media Section */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 16px;
      margin-bottom: 48px;
    }

    .media-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 24px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      transition: background 0.2s, transform 0.2s;
      backdrop-filter: blur(12px);
    }

    .media-card:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-4px);
    }

    .media-card img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
    }

    .media-card span {
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      opacity: 0.9;
    }

    /* Bookmarks Section */
    .bookmarks-section {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .bookmark-group {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }

    .bookmark-group h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.45;
      margin-bottom: 14px;
    }

    .bookmark-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      text-decoration: none;
      color: #fff;
      opacity: 0.85;
      transition: opacity 0.15s;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .bookmark-link:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .bookmark-link:first-of-type {
      padding-top: 0;
    }

    .bookmark-link:hover {
      opacity: 1;
    }

    .bookmark-link img {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .bookmark-link span {
      font-size: 14px;
    }

    .section-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin-bottom: 40px;
    }

    .error {
      padding: 2rem;
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const CONFIGS = ['default', 'media', 'office'];

    const MEDIA_SERVICES = [
      { name: 'YouTube',     url: 'https://www.youtube.com' },
      { name: 'Twitch',      url: 'https://www.twitch.tv' },
      { name: 'Spotify',     url: 'https://open.spotify.com' },
      { name: 'Disney+',     url: 'https://www.disneyplus.com' },
      { name: 'HBO Max',     url: 'https://www.max.com' },
      { name: 'Netflix',     url: 'https://www.netflix.com' },
      { name: 'Prime Video', url: 'https://www.primevideo.com' },
      { name: 'Apple TV',    url: 'https://tv.apple.com' },
    ];

    function faviconUrl(url) {
      const domain = new URL(url).hostname;
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
    }

    function renderMedia() {
      const grid = document.createElement('div');
      grid.className = 'media-grid';

      MEDIA_SERVICES.forEach(({ name, url }) => {
        const a = document.createElement('a');
        a.className = 'media-card';
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const img = document.createElement('img');
        img.src = faviconUrl(url);
        img.alt = name;

        const span = document.createElement('span');
        span.textContent = name;

        a.append(img, span);
        grid.appendChild(a);
      });

      return grid;
    }

    function renderBookmarks(bookmarks) {
      const section = document.createElement('div');
      section.className = 'bookmarks-section';

      bookmarks.forEach(group => {
        const card = document.createElement('div');
        card.className = 'bookmark-group';

        if (group.name) {
          const h3 = document.createElement('h3');
          h3.textContent = group.name;
          card.appendChild(h3);
        }

        (group.links || []).forEach(({ title, url }) => {
          const a = document.createElement('a');
          a.className = 'bookmark-link';
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

          const img = document.createElement('img');
          img.src = faviconUrl(url);
          img.alt = '';

          const span = document.createElement('span');
          span.textContent = title;

          a.append(img, span);
          card.appendChild(a);
        });

        section.appendChild(card);
      });

      return section;
    }

    async function main() {
      const param = new URLSearchParams(location.search).get('config') || 'default';
      const configName = CONFIGS.includes(param) ? param : 'default';
      const app = document.getElementById('app');

      let config;
      try {
        const res = await fetch(`configs/${configName}.yaml`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        config = jsyaml.load(await res.text());
      } catch (e) {
        app.innerHTML = `<div class="error">Failed to load config "${configName}.yaml": ${e.message}</div>`;
        return;
      }

      if (config.background_image) {
        document.body.style.backgroundImage = `url(${config.background_image})`;
      }

      if (config.enable_media_page) {
        app.appendChild(renderMedia());
      }

      if (config.bookmarks?.length) {
        if (config.enable_media_page) {
          const divider = document.createElement('div');
          divider.className = 'section-divider';
          app.appendChild(divider);
        }
        app.appendChild(renderBookmarks(config.bookmarks));
      }
    }

    main();
  </script>
</body>
</html>
